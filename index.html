<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DateRangeDialog — koncepty 1–3</title>
<style>
  :root{--navy:#0a0a6b;--text:#1b1b2b;--muted:#6b6f80;--line:#d7dae3;--focus:#2b3fcf;--chip-on:#dfe5fd}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);display:flex;flex-direction:column;background:#fff}
  header{display:flex;align-items:center;gap:24px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}
  header h1{font-size:16px;font-weight:600;margin:0}
  /* Wszystkie trzy przełączniki wyglądają tak samo: etykieta + grupa segmentów */
  [role=tab]{height:28px;padding:0 10px;border:0;border-radius:6px;background:none;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
  [role=tab][aria-selected=true]{background:var(--chip-on);color:var(--navy);font-weight:600}
  [role=tab]:not([aria-selected=true]):hover,.dir button:not([aria-checked=true]):hover{background:#f1f2f6}
  [role=tab]:focus-visible,.dir button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .dir{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:none}
  .dir .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px}
  .dir button{height:28px;padding:0 10px;border:0;border-radius:6px;background:none;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
  .dir button[aria-checked=true]{background:var(--chip-on);color:var(--navy);font-weight:600}
  main{flex:1;min-height:0;position:relative}
  iframe{border:0;width:100%;height:100%;display:block}
  main.mobile{background:#e9ebf1;display:flex;flex-direction:column;align-items:center;padding:24px 16px;overflow:auto}
  /* Urządzenie: pełny ekran telefonu = pasek statusu + paski Safari + widok strony (iframe) */
  .device{display:contents}
  .sys{display:none}
  main.mobile .device{display:flex;flex-direction:column;margin:auto auto 0;flex:none;background:#f7f7f8;overflow:hidden;box-shadow:0 0 0 10px #1c1d29,0 20px 50px rgba(0,0,0,.25);border-radius:44px;width:390px;height:844px}
  main.m320 .device{width:320px;height:568px;border-radius:14px}
  main.mobile .sys{display:flex;align-items:center;flex:none;font-size:12px;color:#1b1b2b;background:#f7f7f8}
  .sys-status{height:47px;padding:14px 30px 0;justify-content:space-between;font-weight:600;font-size:15px}
  main.m320 .sys-status{height:20px;padding:0 6px;font-size:12px}
  .sys-icons{display:flex;align-items:center;gap:6px}
  main.m320 .sys-icons{gap:4px;transform:scale(.8);transform-origin:right center}
  /* Safari w aktualnym iOS (układ Compact, domyślny): pływający pasek na dole — wstecz | pole adresu | karty */
  .sys-bar{height:56px;padding:0 12px;gap:8px;justify-content:space-between}
  .sys-bar .circ{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.12),inset 0 0 0 .5px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:#1b1b2b;flex:none}
  .sys-bar .pill{flex:1;height:44px;border-radius:22px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.12),inset 0 0 0 .5px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#1b1b2b;font-size:15px;min-width:0}
  .sys-bar .pill b{font-weight:400}
  main.m320 .sys-bar{padding:0 8px;gap:6px}
  main.m320 .sys-bar .pill{font-size:14px;padding:0 12px}
  .sys-home{height:34px;justify-content:center}
  .sys-home::before{content:"";width:134px;height:5px;border-radius:3px;background:#1b1b2b}
  main.m320 .sys-home{display:none !important}
  .frame-cap{display:none;margin:22px auto auto;font-size:12px;color:#6b6f80;text-align:center}
  main.mobile .frame-cap{display:block}
  main.m320 iframe{width:320px !important;height:492px !important}
  main.mobile iframe{width:390px;height:707px;background:#fff;flex:none}
  .diff{position:absolute;inset:0;overflow:auto;padding:28px 40px 60px;font-size:14px;line-height:1.5}
  .diff[hidden]{display:none}
  .diff h2{font-size:20px;margin:0 0 6px}
  .diff h3{font-size:16px;margin:28px 0 10px}
  .diff p{margin:0 0 12px;max-width:900px;color:#33364a}
  table{border-collapse:collapse;width:100%;max-width:1200px}
  th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
  th{background:#f6f7fb;font-weight:600}
  td:first-child{font-weight:600;width:200px}
  ul{margin:0 0 12px;padding-left:20px;max-width:900px}
  li{margin-bottom:4px}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
  .ok{background:#e3f4ea;color:#1f6b3a}.no{background:#fde7ec;color:#a3122f}.mid{background:#fff2d9;color:#8a5a00}
</style>
</head>
<body>
<header>
  <h1>DateRangeDialog</h1>
  <div class="dir">
    <span id="tabLbl">Koncept</span>
    <div class="seg" role="tablist" aria-labelledby="tabLbl">
      <button role="tab" id="t-k1" aria-controls="panel" aria-selected="false" data-k="k1">1 · pola do wpisania</button>
      <button role="tab" id="t-k2" aria-controls="panel" aria-selected="false" data-k="k2">2 · pola tylko do odczytu</button>
      <button role="tab" id="t-k3" aria-controls="panel" aria-selected="false" data-k="k3">3 · tekst w nagłówku</button>
    </div>
  </div>
  <div class="dir" id="bpWrap" style="margin-left:auto">
    <span id="bpLbl">Breakpoint</span>
    <div class="seg" role="radiogroup" aria-labelledby="bpLbl">
      <button type="button" role="radio" data-bp="desktop">Desktop</button>
      <button type="button" role="radio" data-bp="mobile">Mobile 390</button>
      <button type="button" role="radio" data-bp="mobile320">Mobile 320</button>
    </div>

      <button type="button" role="radio" data-dir="future" title="Przelewy planowane: bieżący miesiąc po lewej">Future</button>
    </div>
  </div>
</header>
<main>
  <div class="device" aria-hidden="false">
    <div class="sys sys-status" aria-hidden="true"><span>9:41</span><span class="sys-icons"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg><svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 2.2c2.1 0 4 .8 5.5 2.1l1.2-1.3A9.6 9.6 0 0 0 7.5.4 9.6 9.6 0 0 0 .8 3l1.2 1.3a7.9 7.9 0 0 1 5.5-2.1Zm0 3.4c1.2 0 2.3.4 3.1 1.2l1.2-1.3a6.2 6.2 0 0 0-8.6 0l1.2 1.3c.8-.8 1.9-1.2 3.1-1.2Zm0 3.3c.5 0 .9.2 1.2.5L7.5 10.9 6.3 9.4c.3-.3.7-.5 1.2-.5Z"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4c.8-.3 1.3-1.1 1.3-2S23.8 4.3 23 4Z" fill="currentColor" opacity=".4"/></svg></span></div>
    <iframe id="panel" title="Prototyp" role="tabpanel"></iframe>
    <div class="sys sys-bar" aria-hidden="true"><span class="circ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span><span class="pill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M8 9.5h8M8 13h5"/></svg><b>www.test.pl</b><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4v4.5h-4.5"/></svg></span><span class="circ"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/></svg></span></div>
    <div class="sys sys-home" aria-hidden="true"></div>
  </div>
  <p class="frame-cap" id="frameCap"></p>
</main>
<script type="text/plain" id="src-k1"><!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DateRangeDialog — prototyp</title>
<style>
  :root{
    --navy:#0a0a6b; --navy-ink:#13137a; --text:#1b1b2b; --muted:#6b6f80;
    --line:#c9ccd6; --line-strong:#8a8fa3; --focus:#2b3fcf; --error:#e0173f;
    --band:#cfd8ea; --band-preview:#e3e9f4; --hover:#f3e3f7;
    --chip-on:#dfe5fd; --chip-on-line:#4b5bd6; --page:#f4f5f8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--page)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* --- Strona w tle --- */
  .page{max-width:960px;margin:0 auto;padding:40px 24px}
  .page h1{font-size:26px;font-weight:600;margin:0 0 20px}
  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px}
  .trigger{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;font:inherit;font-size:15px;color:var(--text);cursor:pointer;transition:border-color .15s ease-in-out}
  .trigger:hover{border-color:var(--navy)}
  .trigger:focus-visible,.ftag-x:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .trigger svg{color:var(--navy)}
  .ftag{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 4px 0 12px;border-radius:16px;background:var(--chip-on);font-size:14px;color:var(--text)}
  .ftag[hidden]{display:none}
  .ftag b{font-weight:600;margin-right:4px}
  .ftag-x{width:28px;height:28px;border:0;border-radius:50%;background:none;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background-color .15s ease-in-out}
  .ftag-x:hover{background:rgba(10,10,107,.1)}
  .count{font-size:13px;color:var(--muted);margin:0 0 10px}
  .rows .date{color:var(--muted);width:110px;flex:none}
  .rows .name{flex:1}
  .rows .empty-row{justify-content:center;color:var(--muted)}
  .rows{background:#fff;border-radius:12px;padding:8px 0}
  .rows div{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #eef0f4;font-size:14px}
  .rows div>span:last-child{white-space:nowrap;padding-left:16px}
  .rows div:last-child{border-bottom:0}

  /* --- Panel stanu --- */
  .state{position:fixed;left:16px;top:16px;width:270px;background:#1c1d29;color:#e8e9f0;border-radius:12px;padding:14px 16px;font-size:12px;line-height:1.5;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .state h2{font-size:12px;margin:0 0 8px;color:#fff;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
  .state button{background:none;border:0;color:#a9acc0;cursor:pointer;font:inherit;font-size:11px}
  .state dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
  .state dt{color:#9a9db2}
  .state dd{margin:0;font-family:ui-monospace,Menlo,monospace;word-break:break-word}
  .state.collapsed dl{display:none}

  /* --- Scrim i dialog --- */
  .scrim{position:fixed;inset:0;background:rgba(20,20,32,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
  .scrim[hidden]{display:none}
  .dialog{background:#fff;border-radius:20px;width:656px;max-width:100%;box-shadow:0 12px 40px rgba(0,0,0,.18);outline:none}
  .body{padding:28px 36px 24px}

  /* Gotowe zakresy */
  .chips{display:flex;flex-wrap:wrap;gap:8px 8px;margin-bottom:28px}
  .chip{height:32px;padding:0 15px;border:1px solid var(--line);border-radius:16px;background:#fff;font:inherit;font-size:14px;color:var(--text);cursor:pointer;transition:background-color .15s ease-in-out,border-color .15s ease-in-out}
  .chip:hover{border-color:var(--line-strong)}
  .chip[aria-checked="true"]{background:var(--chip-on);border-color:var(--chip-on-line)}
  .chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* Pola dat */
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:28px}
  .label{display:block;font-size:13px;margin-bottom:4px}   /* Input: Label → pole 4 px */
  .field{position:relative;display:flex;align-items:center;height:40px;border:1px solid var(--line-strong);border-radius:6px;padding:0 12px;background:#fff;cursor:text;transition:border-color .15s ease-in-out,box-shadow .15s ease-in-out}
  .field:hover{border-color:var(--text)}
  .field.invalid{border-color:var(--error)}
  /* Pole aktywne: ramka w kolorze primary, grubsza o 1 px (cień w środku, żeby nic się nie przesuwało) */
  .field.active,.field.target{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
  .segs{display:flex;align-items:center;font-size:15px;font-variant-numeric:tabular-nums;flex:1;min-width:0}
  .seg{padding:1px 1px;border-radius:3px;outline:none;caret-color:transparent}
  .seg.ph{color:var(--muted)}
  .sep{padding:0 1px}
  .sep.ph{color:var(--muted)}
  .field.active .seg.on{background:var(--navy);color:#fff}
  .clear{display:none;width:26px;height:26px;margin-right:-5px;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--navy);align-items:center;justify-content:center}
  .clear:hover{background:var(--hover)}
  .field.active.has-value .clear{display:flex}
  .err{color:var(--error);font-size:13px;line-height:1.45;margin-top:4px;min-height:0}   /* Input: pole → ValidationText 4 px */
  .err:empty{display:none}

  /* Kalendarz */
  .cals{display:grid;grid-template-columns:280px 280px;justify-content:space-between}
  .cal-head{display:flex;align-items:center;height:36px;margin-bottom:10px;position:relative}
  .cal-title{flex:1;text-align:center;font-size:17px}
  .nav{position:absolute;top:2px;width:32px;height:32px;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--navy);display:flex;align-items:center;justify-content:center}
  .nav:hover{background:var(--hover)}
  .nav:focus-visible{outline:2px solid var(--focus)}
  .nav.prev{left:0}.nav.next{right:0}
  .grid{display:grid;grid-template-columns:repeat(7,40px);row-gap:4px}
  .wd{height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
  .cell{position:relative;height:40px;display:flex;align-items:center;justify-content:center;outline:none}
  .cell.empty{pointer-events:none}
  .band{position:absolute;top:2px;bottom:2px;left:0;right:0;background:var(--band)}
  .band.preview{background:var(--band-preview)}
  .cell.start .band{left:50%}
  .cell.end .band{right:50%}
  .cell.start.end .band{display:none}
  .day{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:15px;color:var(--navy-ink);cursor:pointer;transition:background-color .15s ease-in-out,color .15s ease-in-out}
  .day::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--hover);opacity:0;transition:opacity .15s ease-in-out;z-index:-1}
  .cell:hover .day::before,.cell.kbd-hover .day::before{opacity:1}
  .day span{position:relative}
  .cell.start .day,.cell.end .day{background:var(--navy);color:#fff}
  .cell.start .day::before,.cell.end .day::before{display:none}
  /* Dzisiejsza data: podpis „dziś” pod numerem dnia (desktop i mobile) */
  .cell.today .day span{transform:translateY(-5px)}
  .cell.today .day::after{content:"dziś";position:absolute;left:0;right:0;bottom:4px;font-size:10px;line-height:1;text-align:center;color:inherit}
  .cell:focus-visible .day{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--focus)}
  .day{z-index:1}

  /* Stopka */
  .footer{display:flex;align-items:center;gap:16px;border-top:1px solid #e3e5ea;padding:18px 32px 20px 36px}
  .footer .spacer{flex:1}
  .btn{height:40px;padding:0 20px;border-radius:6px;font:inherit;font-size:15px;cursor:pointer;transition:background-color .15s ease-in-out,border-color .15s ease-in-out}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .btn-text{border:0;background:none;color:var(--navy);padding:0 4px;margin-left:-4px}
  .btn-text:hover{text-decoration:underline}
  .btn-sec{border:1px solid var(--line);background:#fff;color:var(--text)}
  .btn-sec:hover{border-color:var(--line-strong)}
  .btn-pri{border:1px solid var(--navy);background:var(--navy);color:#fff}
  .btn-pri:hover{background:#1c1c86}

  @media (min-width:1320px){ body.with-state .scrim{padding-left:300px} body.with-state .page{max-width:none;padding-left:326px;padding-right:40px} }
  @media (max-width:1319px){ .state:not(.open){display:none} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }

  /* ===== Mobile: BottomSheet (szerokość 320–639) ===== */
  .sheet-head{display:none}
  @media (max-width:639px){
    .page{padding:20px 16px}
    .page h1{font-size:22px;margin-bottom:14px}
    .variant{display:none}
    .rows div{padding:12px 14px}
    .rows .date{width:92px}
    /* Lista na telefonie: nazwa i kwota w pierwszej linii, data pod nazwą (kwota nigdy się nie łamie) */
    .rows div:not(.empty-row){display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:2px;align-items:baseline}
    .rows .name{grid-column:1;grid-row:1;min-width:0}
    .rows div>span:last-child{grid-column:2;grid-row:1;white-space:nowrap;text-align:right;padding-left:0}
    .rows .date{grid-column:1;grid-row:2;width:auto;font-size:13px}
    .scrim{align-items:flex-end;padding:0}
    .dialog{width:100%;max-width:600px;max-height:80vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:sheetIn .3s ease-out;touch-action:pan-y}
    .dialog.sheet-out{animation:sheetOut .2s ease-in forwards}
    .scrim{animation:scrimIn .3s ease-out}
    .scrim.scrim-out{animation:scrimOut .2s ease-in forwards}
    .sheet-head{display:flex;align-items:center;position:relative;padding:20px 8px 4px 16px;flex:none}
    .sheet-handle{position:absolute;top:0;left:50%;transform:translateX(-50%);width:96px;height:24px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
    .sheet-handle::before{content:"";width:36px;height:4px;border-radius:2px;background:#c3c7d6}
    .sheet-title{flex:1;font-size:18px;font-weight:600;margin:0}
    .sheet-close{width:44px;height:44px;border:0;background:none;border-radius:50%;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
    .sheet-close:focus-visible{outline:2px solid var(--focus)}
    .dhead{padding:8px 16px 14px;gap:24px;border-radius:0}
    .dh-col{min-width:0;flex:1}
    .dh-value{font-size:16px}
    .body{padding:12px 16px 16px;overflow:auto;flex:1;overscroll-behavior:contain}
    .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 20px;padding:0 16px 2px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:none}
    .fields{gap:12px;margin-bottom:20px}
    .field{padding:0 10px}
    .segs{font-size:15px}
    .field.ro{font-size:14px;padding:0 10px}
    .cals{grid-template-columns:1fr;justify-content:stretch}
    .cal-head{margin-bottom:6px}
    .grid{grid-template-columns:repeat(7,1fr)}
    .cell{height:44px}
    .day{width:40px;height:40px}
    .footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex:none;gap:12px}
    #btnCancel{display:none}
    #btnApply{min-width:140px}
  }

  /* ===== Mobile: zgodnie ze specyfikacją BottomSheet (przyciski stopki jeden pod drugim) ===== */
  @media (max-width:639px){
    .sheet-head{padding:20px 4px 8px 16px}
    .footer{flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
    .footer .spacer{display:none}
    #btnApply{order:-1;width:100%;min-width:0;height:44px}
    #btnReset{width:100%;height:44px;margin:0;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);text-decoration:none}
    #btnReset:hover{text-decoration:none;border-color:var(--line-strong)}
    .nav{width:44px;height:44px;top:-4px}
    .nav.prev{left:-8px}.nav.next{right:-8px}
    .field.ro{text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
    .body{overflow-x:hidden}
    .cal-head{position:sticky;top:-12px;z-index:3;background:#fff;padding-top:4px;height:44px}
    .sheet-head{border-bottom:1px solid transparent;transition:border-color .15s ease-in-out}
    .sheet-head.scrolled{border-bottom-color:#e3e5ea}
    .footer{border-top:1px solid transparent;transition:border-color .15s ease-in-out}
    .footer.more{border-top-color:#e3e5ea}
  }
  /* Najwęższe ekrany (320–359) */
  @media (max-width:359px){
    .fields{gap:8px}
    .field{padding:0 8px}
    .segs{font-size:14px}
    .clear{width:26px;height:26px;margin-right:-5px}
    .clear svg{width:18px;height:18px}
    .day{width:36px;height:36px;font-size:14px}
    .cell{height:40px}
    .dhead{gap:12px}
    .dh-value{font-size:15px}
    .chip{font-size:13px;padding:0 12px}
  }

  /* ===== Mobile: stała wysokość 80% ekranu, przesuwanie miesięcy gestem ===== */
  @media (max-width:639px){
    .dialog{height:80vh;height:80dvh;max-height:none}
    .cals{touch-action:pan-y;user-select:none;-webkit-user-select:none}
  }

  /* ===== Mobile, koncept 1: symulacja klawiatury numerycznej ===== */
  .kb{display:none}
  @media (max-width:639px){
    .segs{font-size:16px}                 /* iOS powiększa stronę przy polach < 16 px */
    body.kb-open .scrim{padding-bottom:var(--kb)}
    body.kb-open .dialog{height:calc(100dvh - var(--kb) - 16px);animation:none}
    .kb{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#d1d4db;display:flex;flex-direction:column;height:var(--kb);transform:translateY(100%);transition:transform .25s ease-out;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    body.kb-open .kb{transform:none}
    .kb-bar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;background:#f0f1f4;border-top:1px solid #c3c7d0;font-size:13px;color:#555a6b}
    .kb-bar button{border:0;background:none;font:inherit;font-size:16px;font-weight:600;color:#1a5fd6;padding:8px;cursor:pointer}
    .kb-keys{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 6px 8px}
    .kb-keys button{border:0;border-radius:6px;background:#fff;box-shadow:0 1px 0 #8e929b;font:inherit;font-size:24px;color:#111;cursor:pointer;touch-action:manipulation}
    .kb-keys button:active{background:#bfc3cc}
    .kb-keys .fn{background:transparent;box-shadow:none;font-size:20px}
    .kb-keys .empty{visibility:hidden}
  }
  @media (max-width:359px){
    .clear{width:26px;height:26px;margin-right:-5px}   /* ClearButton 26 px (InputField); na mobile musi być widoczny także na 320 px */
    .segs{font-size:16px;letter-spacing:-.2px}
  }
  @media (prefers-reduced-motion: reduce){ .kb{transition:none} }

  /* ===== Mobile: przewijana w pionie lista miesięcy, wybrane daty zawsze widoczne ===== */
  .wd-sticky{display:none}
  @media (max-width:639px){
    .body{display:flex;flex-direction:column;overflow:hidden !important;padding-bottom:0}
    .chips,.fields{flex:none}
    .cals{display:block;flex:1;min-height:0;overflow-y:auto;position:relative;margin:0 -16px;padding:0 16px 16px;overscroll-behavior:contain;border-top:1px solid #e3e5ea}
    .wd-sticky{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:repeat(7,1fr);height:32px;align-items:center;background:#fff;font-size:13px;color:var(--muted);text-align:center;margin:0 -16px;padding:0 16px;box-shadow:0 1px 0 #eef0f4}
    .cals .nav{display:none}

    .cals .grid .wd{display:none}
    .fields{margin-bottom:14px}
    .chips{margin-bottom:14px}
  }

  /* ===== Mobile: wybrane daty w nagłówku arkusza (wzorzec Material: mały tytuł + wybór jako główny tekst) ===== */
  @media (max-width:639px){
    .sheet-head{align-items:flex-start;padding:18px 4px 0 16px;border-bottom:0 !important}
    .sheet-title{font-size:13px;font-weight:500;color:var(--muted);padding-top:12px}
    .sheet-close{margin-top:-2px}
    /* koncept 3: Od / Do jako część nagłówka */
    .dhead{padding:2px 16px 14px;gap:16px;border-bottom:1px solid #e3e5ea}
    .dhead ~ .body .chips{margin-top:12px}
    .dh-label{font-size:12px;margin-bottom:2px}
    .dh-value{font-size:18px;font-weight:600}
    .dh-value.ph{font-size:18px;font-weight:400}
    .dh-value.invalid{font-size:15px;font-weight:500}
    /* koncepty 1 i 2: pola jako część nagłówka, nad gotowymi zakresami */
    .body{padding-top:0}
    .fields{order:-1;margin:0 -16px 12px;padding:2px 16px 14px;border-bottom:1px solid #e3e5ea}
    .chips{margin-bottom:12px}
  }

  /* ===== Mobile: bez tytułu „Zakres dat” — wybór jest pierwszą treścią arkusza, krzyżyk w rogu ===== */
  @media (max-width:639px){
    /* Nagłówek wg specyfikacji (układ wyśrodkowany): 8 uchwyt 12, rząd z X (40), 16 odstępu, potem treść na całą szerokość */
    .sheet-head{padding:0;height:20px;position:relative}
    .sheet-title{display:none}
    /* BottomSheet: przycisk zamknięcia przy górnej krawędzi tekstu (środek ikony = środek pierwszej linii), 16 px od prawej krawędzi */
    /* Wg specyfikacji BottomSheet: X w kolumnie 16 px od prawej krawędzi, 16 px odstępu od treści; środek ikony na wysokości pierwszej linii tekstu */
    /* X obok treści: ikona 16 px od prawej krawędzi, środek ikony na wysokości pierwszej linii tekstu */
    .sheet-close{position:absolute;top:12px;right:6px;width:40px;height:40px;margin-top:0;z-index:5}
    /* Uchwyt: obszar dotyku min. 44 px wysokości (specyfikacja), kreska bez zmian */
    /* Uchwyt: 8 px od górnej krawędzi, 12 px do treści (specyfikacja); obszar dotyku 44 px */
    .sheet-handle{height:44px;align-items:flex-start;padding-top:8px;box-sizing:border-box;z-index:4}
    .dhead{padding:4px 52px 20px 16px}   /* 16 px odstępu od ikony X; 20 px pod treścią nagłówka */
    .fields{padding-top:4px}
    /* Kolumna przycisku zamknięcia: pod nim nic nie stoi (pola nie wchodzą pod X) */
    .fields{padding-right:52px;padding-bottom:20px}   /* 16 px odstępu od ikony X; 20 px pod treścią nagłówka */
  }

  /* ===== Mobile: arkusz 90% ekranu, wskazanie następnej daty, „dziś” w kalendarzu ===== */
  @media (max-width:639px){
    .dialog{height:90vh;height:90dvh}
    /* Następna data do wybrania: etykieta w kolorze akcentu (bez ramek) */
    .label.next,.dh-label.next{color:var(--focus);font-weight:600}
    .dh-value.next{color:var(--focus);font-weight:500}
    /* Koncept 3: „Od” i „Do” w dwóch liniach, pełne nazwy miesięcy */
    .dhead{flex-direction:column;gap:2px}
    .dh-col{display:flex;align-items:baseline;gap:10px;min-width:0}
    .dh-label{width:24px;flex:none;margin:0;font-size:13px}
    .dh-value,.dh-value.ph{font-size:17px}
    .dh-value.invalid{font-size:15px}
  }

  /* ===== Mobile, koncept 1: tryb wpisywania (wzorzec Material) — przy klawiaturze kalendarz się chowa ===== */
  .typing-hint{display:none}
  @media (max-width:639px){ .field .segs{position:relative} .field.empty .seg,.field.empty .sep{color:transparent !important} .field.empty .segs::after{content:'Wybierz datę';position:absolute;left:0;top:50%;transform:translateY(-50%);white-space:nowrap;color:var(--muted)} .field.active .seg.on{background:none;color:inherit} .kb, body.kb-open .typing-hint{display:none !important} }
  @media (max-width:639px){
    body.kb-open .dialog{height:auto;max-height:calc(100dvh - var(--kb) - 16px)}
    body.kb-open .cals{display:none}
    body.kb-open .typing-hint{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px;font-size:14px;color:var(--muted)}
    .typing-hint button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--navy);font:inherit;font-weight:600;padding:10px 0;cursor:pointer;white-space:nowrap}
    body.kb-open .body{flex:none}
  }

  /* ===== Mobile: stopka w jednym rzędzie — wg specyfikacji BottomSheet przyciski stoją obok siebie, jeden pod drugim tylko gdy się nie mieszczą ===== */
  @media (max-width:639px){
    .footer{flex-direction:row;gap:8px}
    #btnApply{order:2;flex:1}
    #btnReset{order:1;flex:1}
    #btnReset[hidden]{display:none}
  }

  /* Tryb wpisywania: przy otwartej klawiaturze zostają tylko pola i powrót do kalendarza */
  @media (max-width:639px){
    body.kb-open .chips, body.kb-open .footer{display:none}
  }
  @keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes sheetOut{from{transform:translateY(var(--drag,0))}to{transform:translateY(100%)}}
  @keyframes scrimIn{from{background:rgba(20,20,32,0)}to{background:rgba(20,20,32,.45)}}
  @keyframes scrimOut{from{background:rgba(20,20,32,.45)}to{background:rgba(20,20,32,0)}}
  @media (prefers-reduced-motion: reduce){ .dialog,.scrim,.dialog.sheet-out,.scrim.scrim-out{animation:none !important} }
  .dialog:focus{outline:none}
  /* InputField: desktop rozmiar M = 40 px, mobile zawsze 48 px */
  @media (max-width:639px){ .field,.field.ro{height:48px} }
  /* ===== Pola wg specyfikacji Input / InputField ===== */
  .label{font-size:14px;line-height:20px}
  .field{border-radius:8px;padding:0 12px}                      /* radius-s = 8 px, odstęp wewnętrzny 12 px */
  .segs{font-size:16px;line-height:24px;letter-spacing:0}
  .clear{margin-left:8px;margin-right:0}                        /* 8 px między wartością a ClearButton */
  /* Za wąskie pole (320–359): odstępy zostają jak w specyfikacji, data w aktywnym polu jest przycinana pod X */
  .segs{overflow:hidden;white-space:nowrap}
  @media (max-width:639px){ .segs{font-variant-numeric:normal} }   /* na telefonie cyfry o zwykłej szerokości, jak w koncepcie 2 */
  .fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}   /* kolumny pól zawsze równe, treść nie rozpycha siatki */
</style>

<body>

<main class="page" aria-hidden="false" id="page">
  <h1>Historia operacji</h1>
  <div class="toolbar">
    <button class="trigger" id="trigger" type="button" aria-haspopup="dialog">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 8.5h14M7 2.75v3.5M13 2.75v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Data
    </button>
    <span class="ftag" id="ftag" hidden>
      <b>Data:</b><span id="ftagValue"></span>
      <button class="ftag-x" id="ftagX" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </span>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="rows" id="rows" aria-label="Operacje"></div>
  <div class="sr" aria-live="polite" id="livePage"></div>
</main>


<div class="scrim" id="scrim" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" tabindex="-1">
    <h2 class="sr" id="dlgTitle">Wybierz zakres dat</h2>
    <div class="sheet-head">
      <div class="sheet-handle" id="sheetHandle" aria-hidden="true"></div>
      <p class="sheet-title" aria-hidden="true">Zakres dat</p>
      <button class="sheet-close" type="button" id="sheetClose" aria-label="Zamknij bez zmian">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="body">
      <div class="chips" id="chips" role="radiogroup" aria-label="Gotowe zakresy dat"></div>

      <div class="fields" role="group" aria-label="Zakres dat">
        <div class="fieldwrap" data-f="from">
          <span class="label" id="lbl-from">Data od</span>
          <div class="field" data-f="from" role="group" aria-labelledby="lbl-from">
            <div class="segs"></div>
            <button class="clear" type="button" tabindex="-1" aria-label="Wyczyść datę początkową">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8.25" stroke="currentColor" stroke-width="1.5"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="err" id="err-from"></div>

          <span class="label" id="lbl-to">Data do</span>
          <div class="field" data-f="to" role="group" aria-labelledby="lbl-to">
            <div class="segs"></div>
            <button class="clear" type="button" tabindex="-1" aria-label="Wyczyść datę końcową">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8.25" stroke="currentColor" stroke-width="1.5"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="err" id="err-to"></div>
        </div>
      </div>

      <div class="typing-hint" id="typingHint">
        <span>Wpisz daty</span>
        <button type="button" id="showCal"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 8.5h14M7 2.75v3.5M13 2.75v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Pokaż kalendarz</button>
      </div>
      <div class="cals" id="cals"></div>
    </div>
    <div class="footer">
      <button class="btn btn-text" type="button" id="btnReset">Resetuj</button>
      <span class="spacer"></span>
      <button class="btn btn-sec" type="button" id="btnCancel">Anuluj</button>

    <div class="sr" aria-live="polite" id="live"></div>
